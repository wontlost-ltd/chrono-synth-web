name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths-ignore:
              - dist
              - playwright-report
              - test-results
              - '**/*.test.ts'
              - '**/*.test.tsx'
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  secrets-scan:
    name: Secrets scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog filesystem scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown

  license-check:
    name: Dependency license allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Run allowlist check
        run: |
          npx --yes license-checker-rseidelsohn@^4 \
            --production \
            --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense;MPL-2.0;Python-2.0;BlueOak-1.0.0;CC-BY-4.0;CC-BY-3.0' \
            --excludePackages 'chrono-synth-web@2.0.0' \
            --summary

  sbom:
    name: SBOM (SPDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: chrono-synth-web-sbom-${{ github.sha }}.spdx.json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: chrono-synth-web-sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90
