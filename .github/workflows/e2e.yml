name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: ${{ vars.CI_RUNNER_LABELS && '' || 'npm' }}
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test --project=chromium
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: ${{ vars.CI_RUNNER_LABELS && '' || 'npm' }}
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run axe + keyboard-nav accessibility audit
        # 包含 legacy 两个 spec + P1.3 扩展 suite（e2e/accessibility/）
        run: |
          npx playwright test --project=chromium \
            e2e/axe-a11y.spec.ts \
            e2e/a11y.spec.ts \
            e2e/accessibility/
      - name: Upload a11y report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
